plugins {
    id 'java'
    id 'application'
}

group = 'com.wildforge'
version = '0.1.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// The generator compiles independently of the game/runtime (no OpenGL needed).
sourceSets {
    datagen {
        java.srcDir 'src/datagen/java'
    }
    main {
        // Auto-generated content is packaged in the game JAR / run classpath.
        resources.srcDir layout.buildDirectory.dir('generated/resources/wildforge')
    }
}

def lwjglVersion = '3.3.6' 

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:${lwjglVersion}")

    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-glfw'
    implementation 'org.lwjgl:lwjgl-opengl'
    implementation 'org.joml:joml:1.10.8'
    implementation 'net.java.dev.jna:jna:5.17.0'
    implementation 'net.java.dev.jna:jna-platform:5.17.0'
    implementation 'com.google.code.gson:gson:2.13.2'
    datagenImplementation 'com.google.code.gson:gson:2.13.2'

    runtimeOnly 'org.lwjgl:lwjgl::natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-glfw::natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-opengl::natives-windows'
}

application {
    mainClass = 'com.wildforge.Main'
}

// Keep source encoding deterministic across IDEs and build machines.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}

// Lightweight integration verification without adding a JUnit dependency.
tasks.register('contentCheck', JavaExec) {
    group = 'verification'
    description = 'Validate built-in registries and compact numeric content IDs'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.content.ContentSmokeTest'
}

// Edit the concise catalog in src/datagen/java/.../ContentDataGenerator.java.
// Never hand-edit build/generated resources; they are recreated on demand.
tasks.register('generateContent', JavaExec) {
    group = 'wildforge'
    description = 'Generate block/item JSON and content_index.json from Java data definitions'
    dependsOn tasks.named('datagenClasses')
    classpath = sourceSets.datagen.runtimeClasspath
    mainClass = 'com.wildforge.datagen.ContentDataGenerator'
    args layout.buildDirectory.dir('generated/resources/wildforge').get().asFile.absolutePath
    outputs.dir layout.buildDirectory.dir('generated/resources/wildforge')
}

tasks.named('processResources') {
    dependsOn tasks.named('generateContent')
}

// Isolated save regression suite. Never touches the user's saves/ folder.
tasks.register('saveCheck', JavaExec) {
    group = 'verification'
    description = 'Check save compatibility, incomplete saves and save selection'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.core.SaveManagerSmokeTest'
}

// Run both smoke suites with the standard Gradle verification task.
tasks.named('check') {
    dependsOn tasks.named('contentCheck'), tasks.named('saveCheck')
}

// Add alongside the existing Gradle task definitions.
// generateContent already runs before processResources; worldgen's config
// and texture manifest are included automatically in its output folder.
tasks.named('generateContent') {
    inputs.dir('src/main/resources/textures')
    inputs.dir('src/datagen/resources')
}

tasks.register('worldgenPreview', JavaExec) {
    group = 'wildforge'
    description = 'Generate biome and elevation PNG previews (does not change game worlds)'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.wildforge.worldgen.WorldGenPreview'
    args layout.buildDirectory.dir('worldgen-preview').get().asFile.absolutePath, (project.findProperty('worldSeed') ?: '20261028').toString()
    inputs.property('worldSeed', (project.findProperty('worldSeed') ?: '20261028').toString())
    outputs.dir layout.buildDirectory.dir('worldgen-preview')
}

tasks.register('worldgenCheck', JavaExec) {
    group = 'verification'
    description = 'Check deterministic seeded terrain, cave and vegetation sampling'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.worldgen.WorldGenSmokeTest'
}

tasks.named('check') {
    dependsOn tasks.named('worldgenCheck')
}

// Source biome manifests are authoritative: edits trigger regeneration automatically.
tasks.register('undergroundCheck', JavaExec) {
    group = 'verification'
    description = 'Verify 12 underground profiles, textures, transitions and cave sampling'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.worldgen.UndergroundWorldGenSmokeTest'
}

tasks.register('undergroundPreview', JavaExec) {
    group = 'wildforge'
    description = 'Render depth-slice PNG previews of generated cave biomes'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.wildforge.worldgen.UndergroundWorldGenPreview'
    args layout.buildDirectory.dir('worldgen-preview').get().asFile.absolutePath,
            (project.findProperty('worldSeed') ?: '20261028').toString()
    inputs.property('worldSeed', (project.findProperty('worldSeed') ?: '20261028').toString())
    // Shares the preview folder with worldgenPreview; do not claim its whole
    // directory as an exclusive output of this task.
}

tasks.named('check') {
    dependsOn tasks.named('undergroundCheck')
}

// Hydrology 2C: fluid levels must survive saves, chunk edits and v3 migration.
tasks.register('fluidCheck', JavaExec) {
    group = 'verification'
    description = 'Check fluid levels and invalid inputs for the current save model'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.world.FluidPersistenceSmokeTest'
}
tasks.named('check') {
    dependsOn tasks.named('fluidCheck')
}

// Player game-mode persistence and local developer-command regression suite.
tasks.register('devCheck', JavaExec) {
    group = 'verification'
    description = 'Test developer commands, gamemodes, teleport safety and player save v1/v2 compatibility'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.core.DeveloperModeSmokeTest'
}

// Creative catalog, permission persistence and inventory hitbox regression tests.
tasks.register('creativeCheck', JavaExec) {
    group = 'verification'
    description = 'Check creative inventory catalog and per-world cheat permissions'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.core.CreativeWorldRulesSmokeTest'
}
tasks.named('check') { dependsOn tasks.named('creativeCheck') }

// Creative menu catalog coverage and chat command completion regression test.
tasks.register('catalogCheck', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.ui.CreativeCatalogSmokeTest'
}
tasks.named('check') { dependsOn tasks.named('catalogCheck') }

// Phase: section-level mesh invalidation regression. No GPU/OpenGL context required.
tasks.register('sectionMeshCheck', JavaExec) {
    group = 'verification'
    description = 'Verify per-section block-edit invalidation across vertical boundaries'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.world.SectionMeshingSmokeTest'
}
tasks.named('check') { dependsOn tasks.named('sectionMeshCheck') }

// Phase 2: underground carver determinism, intact roofs and protected bedrock.
tasks.register('caveCheck', JavaExec) {
    group = 'verification'
    description = 'Test seeded geological carvers and cave roof safety'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.worldgen.CaveGenerationSmokeTest'
}
tasks.named('check') { dependsOn tasks.named('caveCheck') }

// Added with the ocean + tree asset expansion. Does not require an OpenGL context.
tasks.register('oceanTreeCheck', JavaExec) {
    group = 'verification'
    description = 'Verify added tree/ocean IDs, oriented log drops, texture layers and registry counts'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.worldgen.OceanTreeIntegrationSmokeTest'
}

// Patch 3A: validates logical states, legacy ID encoding and model face maps.
tasks.register('blockStateCheck', JavaExec) {
    group = 'verification'
    description = 'Validate save-stable block states, all log axes and model textures'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.world.BlockStateSmokeTest'
}
tasks.named('check') { dependsOn tasks.named('blockStateCheck') }

// Patch 3B: executable headless geometry / deterministic foliage / save ID checks.
tasks.register('vegetationCheck', JavaExec) {
    group = 'verification'
    description = 'Verify harvestable foliage, plant models, drops and deterministic canopy generation'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.world.VegetationModelSmokeTest'
}
tasks.named('check') { dependsOn tasks.named('vegetationCheck'), tasks.named('oceanTreeCheck') }

// Patch 3C: headless regression for simulation radius, water LOD and entity pausing.
tasks.register('hydrologyLodCheck', JavaExec) {
    group = 'verification'
    description = 'Verify simulation-distance boundaries, adaptive distant water and paused entity updates'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.world.HydrologyLodSmokeTest'
}
tasks.named('check') { dependsOn tasks.named('hydrologyLodCheck') }

// Patch 4: enforce append-only snow states and foliage collision in the normal check.
tasks.register('worldgenPatch4Check', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.world.WorldgenPatch4SmokeTest'
}
tasks.named('check') { dependsOn tasks.named('worldgenPatch4Check') }

// Patch 4.5: headless drainage/channel and tall-plant model regressions.
tasks.register('riverModelCheck', JavaExec) {
    group = 'verification'
    description = 'Checks channel incision and the tall-plant model metadata.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.worldgen.RiverModelSmokeTest'
}
tasks.named('check') { dependsOn tasks.named('riverModelCheck') }

// Refactor regressions: no OpenGL context or rendered windows required.
tasks.register('architectureCheck', JavaExec) {
    group = 'verification'
    description = 'Verify save transaction integrity and crash recovery'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.core.SaveTransactionSmokeTest'
}
tasks.register('chunkCoordinateCheck', JavaExec) {
    group = 'verification'
    description = 'Verify chunk coordinate packing and legacy indices'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.world.ChunkCoordinatesSmokeTest'
}
tasks.named('check') { dependsOn tasks.named('architectureCheck'), tasks.named('chunkCoordinateCheck') }
tasks.register('fluidRulesCheck', JavaExec) {
    group = 'verification'
    description = 'Verify extracted fluid source, height and tick rules'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.world.FluidRulesSmokeTest'
}
tasks.named('check') { dependsOn tasks.named('fluidRulesCheck') }
tasks.register('droppedItemPhysicsCheck', JavaExec) {
    group = 'verification'
    description = 'Check fast-falling dropped items cannot tunnel through solid floors'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.world.DroppedItemPhysicsSmokeTest'
}
tasks.named('check') { dependsOn tasks.named('droppedItemPhysicsCheck') }

// Phase 2: fixed-rate simulation and chunk-source/storage architecture tests.
// Run individually or via `gradlew check`, no GL context required.
tasks.register('simulationClockCheck', JavaExec) {
    group = 'verification'
    description = 'Validate 60 Hz physics timing, 20 Hz cadence and pause/backlog behavior'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.core.FixedStepClockSmokeTest'
}
tasks.register('chunkStorageCheck', JavaExec) {
    group = 'verification'
    description = 'Validate immutable 16-high section storage and old 512-height indices'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.world.ChunkStorageSmokeTest'
}
tasks.register('chunkSourceCheck', JavaExec) {
    group = 'verification'
    description = 'Validate nearest-first chunk requests, eviction and reset safety'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.world.ChunkSourceSmokeTest'
}
tasks.named('check') {
    dependsOn tasks.named('simulationClockCheck'), tasks.named('chunkStorageCheck'), tasks.named('chunkSourceCheck')
}

// Phase 3: independently executable headless simulation and mesh-worker regressions.
tasks.register('fluidEngineCheck', JavaExec) {
    group = 'verification'
    description = 'Verify fluid scheduling, drainage after source removal and chunk seams'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.world.FluidEngineSmokeTest'
}
tasks.register('meshSchedulerCheck', JavaExec) {
    group = 'verification'
    description = 'Verify async meshing, stale cancellation and LOD invalidation'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.world.ChunkMeshSchedulerSmokeTest'
}
tasks.named('check') { dependsOn tasks.named('fluidEngineCheck'),tasks.named('meshSchedulerCheck') }
tasks.register('cameraInterpolationCheck', JavaExec) {
    group = 'verification'
    description = 'Verify camera interpolation does not mutate saved physics position'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.player.CameraInterpolationSmokeTest'
}
tasks.named('check') { dependsOn tasks.named('cameraInterpolationCheck') }

// Phase 4: multi-noise/spline world generation, slim mesh snapshots and UI model.
['climateTerrainPhase4Check':'com.wildforge.worldgen.ClimateTerrainPhase4SmokeTest',
 'sectionMeshPhase4Check':'com.wildforge.world.SectionMeshBuilderPhase4SmokeTest',
 'newWorldRequestCheck':'com.wildforge.core.NewWorldRequestSmokeTest'].each { taskId, className ->
    tasks.register(taskId, JavaExec) {
        group = 'verification'
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = className
    }
    tasks.named('check') { dependsOn tasks.named(taskId) }
}

['multiNoiseWorldgenCheck':'com.wildforge.worldgen.MultiNoiseWorldgenPhase4SmokeTest',
 'fluidDownhillCheck':'com.wildforge.world.FluidDownhillPhase4SmokeTest'].each { taskId, className ->
    tasks.register(taskId, JavaExec) {
        group = 'verification'
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = className
    }
    tasks.named('check') { dependsOn tasks.named(taskId) }
}

// Ocean-origin seeds must find dry ground even when the first 512 blocks are water.
tasks.register('spawnCheck', JavaExec) {
    group = 'verification'
    description = 'Validate safe deterministic spawn selection for large climate/ocean regions'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.worldgen.SpawnFinderPhase4SmokeTest'
}
tasks.named('check') { dependsOn tasks.named('spawnCheck') }

// Phase 5: world-composition invariants, standalone from OpenGL.
tasks.register('worldCompositionCheck', JavaExec) {
    group = 'verification'
    description = 'Check bedrock gradient, rock strata, ore profiles, cave geometry, aquifers and marine palette completeness'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.worldgen.WorldCompositionSmokeTest'
}
tasks.named('check') { dependsOn tasks.named('worldCompositionCheck') }

// Phase 6: executable deterministic tests for terrain passes, density, mining and lighting.
tasks.register('phase6EngineCheck', JavaExec) {
    group = 'verification'
    description = 'Verify ordered worldgen, 3D density, mining/tool tiers, dual-channel lighting and placed-feature rules'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.phase6.Phase6EngineSmokeTest'
}
tasks.named('check') { dependsOn tasks.named('phase6EngineCheck') }

// New-world preview and statistical profile; does not modify or create saves.
tasks.register('worldgenProfile', JavaExec) {
    group = 'wildforge'
    description = 'Sample surface heights, biome distribution, cave density and vegetation candidates'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.wildforge.worldgen.WorldGenerationProfiler'
    args (project.findProperty('worldSeed') ?: '20261029').toString(),
         (project.findProperty('profileRadius') ?: '512').toString(),
         (project.findProperty('profileStep') ?: '16').toString()
}

// Phase 7: light-cache correctness, bounded relights and section invalidation.
tasks.register('phase7LightingCheck', JavaExec) {
    group = 'verification'
    description = 'Verify cached light reuse, source addition/removal and sky updates'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.phase7.Phase7LightingSmokeTest'
}
tasks.register('phase7LightInvalidationCheck', JavaExec) {
    group = 'verification'
    description = 'Verify vertical dirty-section envelopes for skylight and emission'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.world.Phase7LightInvalidationSmokeTest'
}
tasks.named('check') {
    dependsOn tasks.named('phase7LightingCheck'), tasks.named('phase7LightInvalidationCheck')
}

tasks.register('phase7VegetationCheck', JavaExec) {
    group = 'verification'
    description = 'Verify deterministic minimum spacing for generated tree candidates'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.worldgen.Phase7VegetationSmokeTest'
}
tasks.register('featureProfile', JavaExec) {
    group = 'wildforge'
    description = 'Profile tree species, plants, candidate timing and nearest spacing'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.wildforge.worldgen.FeatureDistributionProfiler'
    args (project.findProperty('worldSeed') ?: '20261029').toString(),
         (project.findProperty('profileRadius') ?: '256').toString()
}
tasks.named('check') { dependsOn tasks.named('phase7VegetationCheck') }

// Phase 8A: typed block properties, bit-packed 16^3 sections, persistent save identities.
tasks.register('phase8AStateCheck', JavaExec) {
    group = 'verification'
    description = 'Check extended block states, bit-packed storage, and version-6 save palettes'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.world.Phase8AStateStorageSmokeTest'
}
tasks.named('check') { dependsOn tasks.named('phase8AStateCheck') }

// Phase 8A continuation: registry-backed stacks and JSON-driven mining data.
tasks.register('phase8AItemCheck', JavaExec) {
    group = 'verification'
    description = 'Test inventory identity, stack operations and keyed player save migration'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.item.Phase8AItemMigrationSmokeTest'
}
tasks.register('phase8AMetadataCheck', JavaExec) {
    group = 'verification'
    description = 'Validate generated mining and tool metadata against runtime behavior'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.item.Phase8AContentMetadataSmokeTest'
}
tasks.named('check') {
    dependsOn tasks.named('phase8AItemCheck'), tasks.named('phase8AMetadataCheck')
}

// Phase 8A completion: registry-driven creative, block models/placement and keyed drop saves.
tasks.register('phase8ARegistryCompletionCheck', JavaExec) {
    group = 'verification'
    description = 'Validate registry-defined creative items, block models, support rules and v1/v2 dropped-item saves'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.content.Phase8ARegistryCompletionSmokeTest'
}
tasks.named('check') { dependsOn tasks.named('phase8ARegistryCompletionCheck') }

// Phase 8A native block identity: generated-content IDs remain typed through meshing.
tasks.register('phase8ANativeBlocksCheck', JavaExec) {
    group = 'verification'
    description = 'Validate namespaced states, palette snapshots, models and chunk-border occlusion'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wildforge.world.Phase8ANativeBlocksSmokeTest'
}
tasks.named('check') { dependsOn tasks.named('phase8ANativeBlocksCheck') }
